 </g><path d="M297 201H359M359 134V239M359 134h26M359 239h26" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/><text x="329" y="188" text-anchor="middle" class="label">-o</text><g transform="translate(423 97)"><g class="motion format" style="animation-delay:0s"><path d="M-27 0H12L27 15V74H-27Z" fill="#fff" stroke="#b3c1d3"/><path d="M12 0V15H27" fill="#e7edf5" stroke="#b3c1d3"/><path d="M-16 28H16M-16 36H9" stroke="#c5cfdd" stroke-width="2"/><rect x="-29" y="47" width="58" height="23" rx="4" fill="#d1f3eb"/><text y="63" text-anchor="middle" font-size="12" font-weight="700">JPG</text></g></g><g transform="translate(502 97)"><g class="motion format" style="animation-delay:0.45s"><path d="M-27 0H12L27 15V74H-27Z" fill="#fff" stroke="#b3c1d3"/><path d="M12 0V15H27" fill="#e7edf5" stroke="#b3c1d3"/><path d="M-16 28H16M-16 36H9" stroke="#c5cfdd" stroke-width="2"/><rect x="-29" y="47" width="58" height="23" rx="4" fill="#d1f3eb"/><text y="63" text-anchor="middle" font-size="12" font-weight="700">PNG</text></g></g><g transform="translate(423 202)"><g class="motion format" style="animation-delay:0.9s"><path d="M-27 0H12L27 15V74H-27Z" fill="#fff" stroke="#b3c1d3"/><path d="M12 0V15H27" fill="#e7edf5" stroke="#b3c1d3"/><path d="M-16 28H16M-16 36H9" stroke="#c5cfdd" stroke-width="2"/><rect x="-29" y="47" width="58" height="23" rx="4" fill="#d1f3eb"/><text y="63" text-anchor="middle" font-size="12" font-weight="700">TIFF</text></g></g><g transform="translate(502 202)"><g class="motion format" style="animation-delay:1.35s"><path d="M-27 0H12L27 15V74H-27Z" fill="#fff" stroke="#b3c1d3"/><path d="M12 0V15H27" fill="#e7edf5" stroke="#b3c1d3"/><path d="M-16 28H16M-16 36H9" stroke="#c5cfdd" stroke-width="2"/><rect x="-29" y="47" width="58" height="23" rx="4" fill="#d1f3eb"/><text y="63" text-anchor="middle" font-size="12" font-weight="700">PDF</text></g></g>
